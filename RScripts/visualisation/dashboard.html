<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<style>body{background-color:white;}</style>

  <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #000000; }
        .header { padding: 15px; text-align: center; font-size: 16px; color: white; }
        .container {
          display: grid;
          grid-template-columns: 1.8fr 1.2fr;
          grid-template-rows: minmax(0,1fr) minmax(0,1fr);
          gap: 20px; padding: 20px; align-items: stretch;
          height: calc(100vh - 90px);
          box-sizing: border-box;
        }
        .box {
          background: white; border-radius: 12px;
          box-shadow: 0 2px 8px rgba(0,0,0,0.1);
          padding: 10px; display: flex; flex-direction: column; min-height: 0;
        }
        h3 { margin: 0 0 8px 0; font-weight: 600; }
        .caption { font-size: 13px; color: #555; margin-top: 8px; }
        .fill { flex: 1; min-height: 0; overflow: hidden; }
        .iframe-wrap {
          width: 100%;
          height: 100%;
          border: 0;
          border-radius: 8px;
          overflow: hidden;
          background: #fff;
        }
        .iframe-inner {
          width: 100%;
          height: 100%;
          border: 0;
        }
        .phylo-wrap { position: relative; width: 100%; height: 100%; }
        .vslider{
            margin-top: auto;
            padding-top: 6px;
            height: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
          }

        .vslider input[type=range]{
          -webkit-appearance: none;
          appearance: none;
          width:90%;
          height:6px;
        }

      </style>
</head>
<html>
  <body>
    <div class="header">Open-Ended Evolution Dashboard</div>
    <div class="container">
      <div class="box" style="grid-row: 1 / span 2; box-sizing: border-box; padding: 6px 10px 10px 10px;">
        <div style="transform: translate(6px, 4px);">
          <h3>トルシム惑星の生命の樹の進化</h3>
          <div class="caption">一つの点が一匹の生き物を表している。時間が経つと、体の大きさ、動きの速さ、寿命、賢さ、子供の数が進化によって変化する。ここでは、体の大きさと寿命を表示している。１つの種(スピーシーズ)から新種が進化したところに、木が枝分かれをしている。</div>
        </div>
        <div class="fill" style="transform: scale(0.93); transform-origin: top center;">
          <div class="iframe-wrap">
            <video src="movie.mp4" type="video/mp4" autoplay loop muted playsinline width="100%" style="transform: translateY(-120px) scale(0.93); transform-origin: top center;"></video>
          </div>
        </div>
      </div>
      <div class="box">
        <h3>新種の誕生</h3>
        <div class="caption">突然変異によって、生き物は自分と少し違う子供を産む。その「ちょっと違う」が生存に役立つ変異の場合、子供が生き残って、自分の子供を産んで、数世代で「大分違う」生き物になる。</div>
        <div class="fill">
          <div id="clusterPlot" class="iframe-wrap">
            <img id="clusterIframe" src="cluster_images/1.png" class="iframe-inner" style="width: 75%; margin:auto; display: block;"/>
          </div>
        </div>
        <div class="vslider">
          <input id="timeSlider" type="range" min="1" max="16" step="1" value="1"/>
        </div>
        <script>
      (function(){
        const slider = document.getElementById('timeSlider');
        const img    = document.getElementById('clusterIframe');
        const INTERVAL_MS = 15000;

        function setImage(){
          const idx = parseInt(slider.value, 10);
          img.src = 'cluster_images/' + idx + '.png';
        }

        function advance(){
          let idx = parseInt(slider.value, 10) + 1;
          if (idx > parseInt(slider.max, 10)) idx = parseInt(slider.min, 10);
          slider.value = idx;
          setImage();
        }

        setImage();
        slider.addEventListener('input', setImage);
        setInterval(advance, INTERVAL_MS);
      })();
    </script>
      </div>
      <div class="box">
        <h3>系統樹</h3>
        <div class="caption">生物の進化の道筋。</div>
        <div class="fill phylo-wrap">
          <div id="phyloPlot" class="iframe-wrap">
            <img id="phyloIframe" src="phylogentic_images/1.png" class="iframe-inner"/>
          </div>
        </div>
      </div>
    </div>
    <script>
      (function(){
        const img = document.getElementById('phyloIframe');
        const INTERVAL_MS = 15000;
        const MAX_IDX = 16;
        let idx = 1;
    
        function setImage(){
          img.src = 'phylogenetic_images/' + idx + '.png';
        }
    
        function advance(){
          idx++;
          if (idx > MAX_IDX) idx = 1;
          setImage();
        }
    
        setImage();
        setInterval(advance, INTERVAL_MS);
      })();
    </script>
  </body>
</html>
</html>
